name: cards
description: A new Flutter project.
publish_to: none
version: 0.5.10+43
environment:
  sdk: '>=3.2.6 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_local_notifications: ^22.1.0
  flutter_native_splash: ^2.3.10
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^10.2.1
  pointycastle: ^4.0.0
  path_provider: ^2.1.3
  share_plus: ^13.2.1
  file_selector: ^1.0.3
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  local_notifier: ^0.1.6
  provider: ^6.0.0
  local_auth: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  test: ^1.31.0
flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Rubik
      fonts:
        - asset: fonts/Rubik-Regular.ttf
          weight: 400
        - asset: fonts/Rubik-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: fonts/Rubik-SemiBoldItalic.ttf
          weight: 600
          style: italic
